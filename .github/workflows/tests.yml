name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: Setup from a clean checkout, then all test suites (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, gd, intl, zip, sodium
          coverage: none
      # The same two commands the README gives a person: nothing else is configured.
      - run: ./cadenza doctor || true
      - run: ./cadenza setup
      - run: ./cadenza test
