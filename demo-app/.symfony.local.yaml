workers:
    # Background jobs (imports) and the daily sync of connected accounts
    messenger_consume:
        # --no-debug: in dev, Doctrine keeps a backtrace of every query, which a long-running worker runs out of memory on
        cmd: ['symfony', 'console', 'messenger:consume', 'async', 'scheduler_cadenza', '--no-debug', '--memory-limit=192M', '--time-limit=3600']
        watch: ['config', 'src', 'templates', 'vendor/cadenza']
    # New classes in templates (also the runtime bundle's) are compiled as you save
    tailwind:
        cmd: ['symfony', 'console', 'tailwind:build', '--watch']
