ai:
    agent:
        studio:
            platform: 'ai.platform.generic.default'
            model: '%env(vault:CADENZA_LLM_MODEL)%'
            max_tool_calls: 24
            tools:
                - 'App\Agent\Tool\SiteTools'
                - 'App\Agent\Tool\UiTools'
                - 'App\Agent\Tool\ImageTools'
                - 'App\Agent\Tool\ConnectorTools'
                - 'App\Agent\Tool\DiagnosticsTools'
                - 'App\Agent\Tool\CollectionTools'
                - 'App\Agent\Tool\FormTools'
                - 'App\Agent\Tool\StatsTools'
                - 'App\Agent\Tool\MemberTools'
                - 'App\Agent\Tool\RecordTools'
                - 'App\Agent\Tool\TranslateTools'
                - 'App\Agent\Tool\DocumentTools'
                - 'App\Agent\Tool\BlockTools'
                - 'App\Agent\Tool\WidgetTools'
                - 'App\Agent\Tool\SketchTools'
        # Used when the main model does not answer in time (local servers can be busy).
        studio_fallback:
            platform: 'ai.platform.generic.fallback'
            model: '%env(vault:CADENZA_LLM_FALLBACK_MODEL)%'
            max_tool_calls: 24
            tools:
                - 'App\Agent\Tool\SiteTools'
                - 'App\Agent\Tool\UiTools'
                - 'App\Agent\Tool\ImageTools'
                - 'App\Agent\Tool\ConnectorTools'
                - 'App\Agent\Tool\DiagnosticsTools'
                - 'App\Agent\Tool\CollectionTools'
                - 'App\Agent\Tool\FormTools'
                - 'App\Agent\Tool\StatsTools'
                - 'App\Agent\Tool\MemberTools'
                - 'App\Agent\Tool\RecordTools'
                - 'App\Agent\Tool\TranslateTools'
                - 'App\Agent\Tool\DocumentTools'
                - 'App\Agent\Tool\BlockTools'
                - 'App\Agent\Tool\WidgetTools'
                - 'App\Agent\Tool\SketchTools'
        studio_vision:
            platform: 'ai.platform.generic.vision'
            model: '%env(vault:CADENZA_LLM_VISION_MODEL)%'
            max_tool_calls: 24
            tools:
                - 'App\Agent\Tool\SiteTools'
                - 'App\Agent\Tool\UiTools'
                - 'App\Agent\Tool\ImageTools'
                - 'App\Agent\Tool\ConnectorTools'
                - 'App\Agent\Tool\DiagnosticsTools'
                - 'App\Agent\Tool\CollectionTools'
                - 'App\Agent\Tool\FormTools'
                - 'App\Agent\Tool\StatsTools'
                - 'App\Agent\Tool\MemberTools'
                - 'App\Agent\Tool\RecordTools'
                - 'App\Agent\Tool\TranslateTools'
                - 'App\Agent\Tool\DocumentTools'
                - 'App\Agent\Tool\BlockTools'
                - 'App\Agent\Tool\WidgetTools'
                - 'App\Agent\Tool\SketchTools'

        # Pictures on the main API (e.g. Gemma on Ollama Cloud): the vision API's free models are rate-limited.
        studio_seeing:
            platform: 'ai.platform.generic.default'
            model: '%env(default:cadenza.vision_model:vault:CADENZA_SEEING_MODEL)%'
            max_tool_calls: 24
            tools:
                - 'App\Agent\Tool\SiteTools'
                - 'App\Agent\Tool\UiTools'
                - 'App\Agent\Tool\ImageTools'
                - 'App\Agent\Tool\ConnectorTools'
                - 'App\Agent\Tool\DiagnosticsTools'
                - 'App\Agent\Tool\CollectionTools'
                - 'App\Agent\Tool\FormTools'
                - 'App\Agent\Tool\StatsTools'
                - 'App\Agent\Tool\MemberTools'
                - 'App\Agent\Tool\RecordTools'
                - 'App\Agent\Tool\TranslateTools'
                - 'App\Agent\Tool\DocumentTools'
                - 'App\Agent\Tool\BlockTools'
                - 'App\Agent\Tool\WidgetTools'
                - 'App\Agent\Tool\SketchTools'
