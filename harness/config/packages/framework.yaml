# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    # Local models can take minutes on long prompts; do not give up after the default 60 s of silence.
    http_client:
        default_options:
            timeout: 300
    secret: '%env(APP_SECRET)%'

    # Note that the session will be started ONLY if you read or write from it.
    session: true

    #esi: true
    #fragments: true

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file

parameters:
    cadenza_public_url: 'http://127.0.0.1:8011'
    cadenza_image_model: 'black-forest-labs/FLUX.1-schnell'
